name: Mobile checks

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-checks.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-checks.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Analyze
        run: flutter analyze
        working-directory: apps/mobile
      - name: Run tests
        run: flutter test
        working-directory: apps/mobile
