plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('key.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}
def releaseSigningValues = [
    releaseSigningProperties['storeFile'],
    releaseSigningProperties['storePassword'],
    releaseSigningProperties['keyAlias'],
    releaseSigningProperties['keyPassword'],
]
def releaseSigningValuesPresent = releaseSigningValues.every {
    it != null && !it.toString().trim().isEmpty() && !it.toString().contains('REPLACE_WITH')
} && file(releaseSigningProperties['storeFile'] ?: '__missing_release_keystore__').isFile()

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.voltstop.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.voltstop.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (releaseSigningValuesPresent) {
                storeFile file(releaseSigningProperties['storeFile'])
                storePassword releaseSigningProperties['storePassword']
                keyAlias releaseSigningProperties['keyAlias']
                keyPassword releaseSigningProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseSigningValuesPresent ? signingConfigs.release : null
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def createsReleaseArtifact = taskGraph.allTasks.any {
        it.name == 'assembleRelease' || it.name == 'bundleRelease'
    }
    if (createsReleaseArtifact && !releaseSigningValuesPresent) {
        throw new GradleException(
            'Release signing is not configured. Create android/key.properties from key.properties.example and use the existing VoltStop release keystore.'
        )
    }
}

flutter {
    source '../..'
}
